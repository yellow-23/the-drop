# Configuración para Netlify

[build]
command = "cd frontend && npm install && npm run build"
publish = "frontend/dist"

[build.environment]
VITE_API_URL = "https://the-drop-i4pa.onrender.com/api"

# Si usas Netlify Functions para el backend (opcional)
# command = "cd frontend && npm run build && cd ../backend && npm install"
# functions = "backend/functions"

[[redirects]]
from = "/api/*"
to = "https://the-drop-i4pa.onrender.com/api/:splat"
status = 200

# Para Single Page Application (React Router)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
