services:
  - type: web
    name: the-drop-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: the-drop-db
          property: connectionString

  - type: web
    name: the-drop-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishDirectory: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://the-drop-backend.onrender.com/api

  - type: pserv
    name: the-drop-db
    plan: free
    ipAllowList: []
    databaseName: thedrop_db
    user: thedrop_user
